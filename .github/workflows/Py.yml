name: Bale Modrinth Bot

on:
  workflow_dispatch:        # فقط اجرای دستی از تب Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # کمتر از ۶ ساعت (محدودیت GitHub Actions)
    permissions:
      contents: write       # اجازه پوش کردن به مخزن برای کامیت data.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - name: Commit and push data.json if changed
        run: |
          git config --local user.email "myket@users.noreply.github.com"
          git config --local user.name "Myket[bot]"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes in data.json"
          else
            git commit -m "Update data.json [skip ci]"
            git push
          fi
