name: Rubika Bot
on:
  schedule:
    - cron: '*/5 * * * *'   # هر ۵ دقیقه (حداقل مجاز)
  workflow_dispatch:        # اجرای دستی هم داشته باشی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # کمتر از ۶ ساعت
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install rubka requests
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
